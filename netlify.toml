# These Supabase values are intentionally browser-public. Never add a secret or service-role key here.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_SUPABASE_URL = "https://sznrjzpzfrihysatmrom.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_QApCSoy7zYxmWT9544a2nQ_k6iOdEtD"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
